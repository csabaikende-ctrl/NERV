name: Build ProjectNERV
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'paradigm'
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [r9q2]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'
      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld jq protobuf-compiler pcre2-utils webp \
            curl xxd patchelf flex bison libarchive-tools build-essential python3.12-venv device-tree-compiler
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp security/aosp_platform.pk8 security/platform.pk8
          cp security/aosp_platform.x509.pem security/platform.x509.pem
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'
      - name: Pre-download magiskboot
        run: |
          mkdir -p out/tools/bin
          curl -L -s -o magisk.apk "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk"
          unzip -q -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d out/tools/bin/
          mv out/tools/bin/libmagiskboot.so out/tools/bin/magiskboot
          chmod +x out/tools/bin/magiskboot
          rm magisk.apk
      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh
      - name: Pin firmware to One UI 7
        run: |
          python3 - << 'EOF'
          import re
          fw_versions = {
              'SM-G990B2': 'G990B2XXSFHYI1/G990B2OXMFHYI1/G990B2XXSFHYI1',
              'SM-S911B':  'S911BXXS8EYK5/S911BOXM8EYK5/S911BXXU8EYI5',
          }
          with open('scripts/download_fw.sh', 'r') as f:
              content = f.read()
          old = 'samloader -m "$MODEL" -r "$CSC" -i "$IMEI" -s "$SERIAL_NO" download -O'
          new_lines = []
          new_lines.append('  FW_VERSION=""')
          for model, ver in fw_versions.items():
              new_lines.append(f'  [[ "$MODEL" == "{model}" ]] && FW_VERSION="{ver}"')
          new_lines.append('  FW_VER_FLAG=""')
          new_lines.append('  [[ -n "$FW_VERSION" ]] && FW_VER_FLAG="-v $FW_VERSION"')
          new_call = 'samloader -m "$MODEL" -r "$CSC" -i "$IMEI" -s "$SERIAL_NO" download $FW_VER_FLAG -O'
          replacement = '\n'.join(new_lines) + '\n  ' + new_call
          content = content.replace(old, replacement)
          with open('scripts/download_fw.sh', 'w') as f:
              f.write(content)
          print('Patched download_fw.sh to use One UI 7 firmware versions')
          EOF
      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-target
      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-target
      - name: Download target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-source
      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-source
      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NERV-r9q2
          path: out/*.zip
          retention-days: 7
